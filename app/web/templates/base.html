<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="generator" content="Закупщик {{ build_mark }}">
  <title>{% block title %}Закупщик{% endblock %}</title>
  <link rel="preload" href="/static/fonts/manrope-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/static/tokens.css">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">Закупщик</a>
    <nav aria-label="Разделы">
      <a href="/status">Состояние стенда</a>
      {% if user %}
      <form method="post" action="/logout"><button class="btn btn-quiet" type="submit">Выйти</button></form>
      {% endif %}
    </nav>
  </header>
  <main>{% block content %}{% endblock %}</main>
  <footer class="footer">Прототип для хакатона «ИИкузница» 2026. Сборка {{ build_mark }}.</footer>
</body>
</html>
