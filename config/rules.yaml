# Правила отбора и приоритета (ARCHITECTURE.md §7.2). Только данные по схеме app/scoring/rules.py: числа, перечни, слова.
# Читается в начале каждого цикла; версия правил = хэш этого файла, пишется в оценку сделки.
# Ошибка в файле → цикл не стартует, остаются прежние правила.

filters:
  # Сумма: больше — отсекаем; НМЦ не указана — берём с риском «сумма не указана»
  max_nmck_rub: 1000000
  # Способ закупки (§6.1): конкурентные процедуры не берём
  procedures_take: [request_kp, single_supplier, small_purchase, quotation_session]
  procedures_cut: [tender, auction, request_quotes, request_proposals]
  # До конца приёма заявок должно оставаться не меньше, ч
  min_hours_left: 3
  # Признаки «только МСП/СМП» в тексте (корни, без учёта регистра)
  smb_only_phrases:
    - "только субъект"
    - "среди субъектов малого"
    - "участниками закупки могут быть только"
    - "ст. 3.4"
    - "статьи 3.4"
    - "1352"
    - "смп и сонко"
    - "соно"
    - "статьи 30"
    - "ст. 30"
  # Это ПО: вендор из каталога или любое из слов
  software_words:
    - "программ"
    - "лиценз"
    - "неисключительн"
    - "антивирус"
    - "средств защиты информации"
    - "сзи"
    - "операционн"
    - "криптограф"
    - "электронной подписи"
    - "резервного копирования"
  # Не наша сделка, если нет вендора из каталога: услуги и чужие продукты
  stop_words:
    - "обслуживани"
    - "сопровождени"
    - "техническ"
    - "разработк"
    - "доработк"
    - "адаптаци"
    - "внедрени"
    - "консультантплюс"
    - "консультант плюс"
    - "гарант"
    - "1с"
    - "1c"
    - "контур"
    - "сбис"
    - "saby"
    - "usergate"
    - "баз данных"
    - "базы данных"
    - "базе данных"
    - "мониторинга транспорт"
    - "навигацион"
    - "обучени"
    - "аренд"
    - "облачн"
    - "касс"
    - "картридж"
    - "оборудовани"
    - "компьютер"
    - "ноутбук"
    - "моноблок"
    - "сервер "
    - "принтер"

  # Без вендора из каталога и с названием продукта в кавычках («ТехноКад») — продукт чужой
  cut_quoted_foreign_product: true

conditions:
  # «N из 5» (§7): пороги условий
  max_postpay_days: 7
  min_hours_for_kp: 24

# Приоритет внутри группы «N из 5» (§7): сумма весов = 1. Каждое слагаемое от 0 до 1 показывается в разложении
weights:
  coverage: 0.3     # доля позиций, найденных в каталоге
  margin: 0.2       # сумма по ценам каталога укладывается в НМЦ (нет цен — 0.5)
  amount: 0.2       # НМЦ относительно max_nmck_rub
  payment: 0.15     # предоплата 1, отсрочка в пределах порога 0.7, иначе 0
  simplicity: 0.15  # без ТЗ во вложении и без договора заказчика

# КП по шаблону заказчицы (§7.1). Подпись и печать ставит человек — в файле только ФИО и должность
kp:
  valid_days: 10                  # срок действия КП; закупка требует больше — берём её срок
  vat_rate: 22                    # ставка НДС, %; ПО из реестра Минцифры — без НДС (пп. 26 п. 2 ст. 149 НК РФ)
  default_payment: "Предоплата"   # если в закупке порядок оплаты не указан (в отчёте будет риск)
  default_delivery: "1–3 рабочих дня"
  signer_name: "Фамилия Имя"      # демостенд: заглушка, заказчица подставит своего подписанта
  signer_title: "Должность"

notify:
  daily_report_at: "09:00"
  urgent_hours_left: 24
